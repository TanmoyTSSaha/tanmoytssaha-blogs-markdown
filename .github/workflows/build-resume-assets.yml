name: Build Resume Assets

on:
  push:
    paths:
      - "resume/resume.tex"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LaTeX and LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            libreoffice-writer

      - name: Verify required LaTeX packages
        run: |
          kpsewhich marvosym.sty
          kpsewhich fontawesome5.sty
          kpsewhich fullpage.sty

      - name: Compile PDF
        working-directory: resume
        run: |
          pdflatex -interaction=nonstopmode resume.tex
          pdflatex -interaction=nonstopmode resume.tex
          test -f resume.pdf
          mv resume.pdf Tanmoy_Saha_Data_Engineering_Resume.pdf

      - name: Convert to DOCX
        working-directory: resume
        env:
          HOME: /tmp
        run: |
          test -f Tanmoy_Saha_Data_Engineering_Resume.pdf
          # PDF → ODT → DOCX: Writer's PDF import filter is required for step 1.
          libreoffice \
            --headless \
            --norestore \
            --nologo \
            --nofirststartwizard \
            "-env:UserInstallation=file:///tmp/libreoffice-profile" \
            --infilter="writer_pdf_import" \
            --convert-to odt \
            --outdir . \
            Tanmoy_Saha_Data_Engineering_Resume.pdf
          test -f Tanmoy_Saha_Data_Engineering_Resume.odt
          libreoffice \
            --headless \
            --norestore \
            --nologo \
            --nofirststartwizard \
            "-env:UserInstallation=file:///tmp/libreoffice-profile" \
            --convert-to docx:"MS Word 2007 XML" \
            --outdir . \
            Tanmoy_Saha_Data_Engineering_Resume.odt
          test -f Tanmoy_Saha_Data_Engineering_Resume.docx
          rm -f Tanmoy_Saha_Data_Engineering_Resume.odt

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resume/Tanmoy_Saha_Data_Engineering_Resume.pdf resume/Tanmoy_Saha_Data_Engineering_Resume.docx
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: rebuild resume PDF and DOCX assets [skip ci]"
          git push